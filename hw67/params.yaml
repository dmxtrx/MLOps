# Один бюджет и один val для всех шести кандидатов. Это короткий учебный поиск.
model:
  name: Qwen/Qwen3-0.6B
  revision: main   # run сохраняет разрешённый commit HF, а не только main
  device: auto
  dtype: bfloat16
  enable_thinking: false
data:
  train: data/tokenized/train.pt
  val: data/tokenized/val.pt
train:
  seed: 42
  max_steps: 4
  train_limit: 32
  val_limit: 8
  batch_size: 1
  grad_accum: 2
  eval_every: 2
  gradient_checkpointing: true
lora:
  dropout: 0.05
  alpha_over_r: 2
sweep:
  - {name: qv-r4-low, r: 4, lr: 0.0001, target_modules: [q_proj, v_proj]}
  - {name: qv-r4-high, r: 4, lr: 0.0003, target_modules: [q_proj, v_proj]}
  - {name: qv-r8-low, r: 8, lr: 0.0001, target_modules: [q_proj, v_proj]}
  - {name: qv-r8-high, r: 8, lr: 0.0003, target_modules: [q_proj, v_proj]}
  - {name: all-r8-low, r: 8, lr: 0.0001, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
  - {name: all-r8-high, r: 8, lr: 0.0003, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
tracking:
  uri: http://127.0.0.1:5006
  experiment: hw6-lora
registry:
  name: my-qwen-adapter
  alias: champion
  # Порог относительный к базе на ТОМ ЖЕ val; меньше loss — лучше.
  max_val_ratio: 1.0
generation:
  max_new_tokens: 16
  system: "You answer multiple-choice questions from medical entrance exams. The options are numbered from 0. Choose the single correct option. Reply with the option number and its text only, no explanation."
  prompts:
    - "Subject: Biochemistry\nTopic: Vitamins\n\nQuestion:\nDeficiency of which vitamin causes night blindness?\n\nOptions:\n0. Vitamin C\n1. Vitamin A\n2. Vitamin D\n3. Vitamin B12"
    - "Subject: Physiology\nTopic: Cardiovascular system\n\nQuestion:\nWhich valve lies between the left atrium and the left ventricle?\n\nOptions:\n0. Tricuspid valve\n1. Pulmonary valve\n2. Mitral valve\n3. Aortic valve"
