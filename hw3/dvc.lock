        collect:
          version: v2
          n_rows: 3000
          sources:
            v1:
            - sources/medmcqa/data/train-00000-of-00001.parquet
            v2:
            - sources/medmcqa/data/train-00000-of-00001.parquet
            - sources/medmcqa/data/validation-00000-of-00001.parquet
          subjects:
          system_prompts:
          - You answer multiple-choice questions from Indian medical entrance 
            exams (AIIMS, NEET PG). The options are numbered from 0. Choose the 
            single correct option. Reply with the option number and its text 
            only, no explanation.
          - Below is a medical exam question with four options numbered from 
            zero. Pick the one correct option and output its number and text. Do
            not explain.
          - 'Task: select the correct answer to a medical multiple-choice question.
            Options are numbered starting at 0. Output only the number and the text
            of the chosen option, without reasoning.'
          - 'You help students prepare for medical postgraduate entrance exams. Given
            a question and options numbered from 0, name the single correct option:
            first its number, then its text. Add no commentary.'
          - Answer the clinical multiple-choice question. Options are numbered 
            from 0 and exactly one is correct. Output the number of the correct 
            option followed by its text, and nothing else.
        paths.metrics_collect: metrics/collect.json
        paths.raw: data/raw.jsonl
    outs:
